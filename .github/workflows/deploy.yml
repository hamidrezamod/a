# ============================================================
# ساخت و انتشار خودکار سایت استاتیک روی GitHub Pages
# با هر بار مرج کردن روی main، سایت منتشر می‌شود.
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v7

      - name: آماده‌سازی برای انتشار
        uses: actions/configure-pages@v6

      - name: بستن بسته انتشار
        run: |
          mkdir -p _site
          cp index.html torob-plp.html movie-night.html windows-cc.html gadgetgrid.html axemoon.html capital-fruit.html aura.html _site/
          cp -r css assets _site/

      - name: بارگذاری فایل‌های ساخته‌شده
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: انتشار روی GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
