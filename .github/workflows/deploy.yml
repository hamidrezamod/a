# ============================================================
# ساخت و انتشار خودکار سایت روی GitHub Pages
# کافی است فایل‌های سایت را تغییر بدهی و در شاخه main بگذاری؛
# این فایل خودش سایت را می‌سازد و منتشر می‌کند.
# نیازی نیست هیچ‌وقت دستی کاری انجام بدهی.
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت فایل‌های مخزن
        uses: actions/checkout@v7

      - name: نصب Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: ساخت نسخه نهایی
        run: npm run build

      - name: آماده‌سازی برای انتشار
        uses: actions/configure-pages@v6

      - name: بارگذاری فایل‌های ساخته‌شده
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: انتشار روی GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
