name: Figma Data Pull

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch geometry if MODE=geometry
        run: |
          cat > geometry.sh <<'GS'
          #!/usr/bin/env bash
          set -uo pipefail
          mkdir -p out/renders
          FILE="NBU14n0h7ZYKBS6XxcVih2"
          BODY=$(jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH")
          echo "body-len: ${#BODY}"
          FIGMA_TOKEN=$(echo "$BODY" | grep -oE 'figd_[A-Za-z0-9_-]+' | head -1 || true)
          echo "token-len: ${#FIGMA_TOKEN}"
          MODE=$(echo "$BODY" | grep -oE 'MODE=[a-z]+' | head -1 | cut -d= -f2 || true)
          echo "mode: ${MODE:-none}"
          if [ "$MODE" = "geometry" ] && [ -n "$FIGMA_TOKEN" ]; then
            echo "fetching full file with geometry=paths ..."
            code=$(curl -s -o out/full-geometry.json -w "%{http_code}" -H "X-Figma-Token: $FIGMA_TOKEN" \
              "https://api.figma.com/v1/files/$FILE?geometry=paths")
            echo "http=$code"
            [ "$code" != "200" ] && head -c 300 out/full-geometry.json
            du -h out/full-geometry.json || true
            echo "$MODE" > out/.mode || true
          fi
          echo "geometry-step-end"
          GS
          chmod +x geometry.sh
          ./geometry.sh 2>&1 | tee out/geometry-log.txt
          echo "exit=$?"

      - name: Render Figma nodes from render-plan.json
        if: ${{ !contains(github.event.pull_request.body, 'MODE=geometry') }}
        run: |
          cat > render.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -uo pipefail
          FILE="NBU14n0h7ZYKBS6XxcVih2"
          FIGMA_TOKEN=$(jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH" | grep -oE 'figd_[A-Za-z0-9_-]+' | head -1)
          if [ -z "$FIGMA_TOKEN" ]; then echo "ERROR: no token found in PR body"; exit 1; fi
          echo "token length: ${#FIGMA_TOKEN}"
          PLAN="figma-import/render-plan.json"
          [ -f "$PLAN" ] || { echo "ERROR: missing $PLAN"; exit 1; }
          mkdir -p out/renders

          TOTAL=$(jq length "$PLAN")
          echo "nodes to render: $TOTAL"
          i=0
          while [ $i -lt $TOTAL ]; do
            CHUNK=$(jq -c ".[$i:$((i+25))]" "$PLAN")
            IDS=$(echo "$CHUNK" | jq -r '.[].id' | sed 's/:/%3A/g' | paste -sd,)
            attempt=0
            code=000
            while true; do
              code=$(curl -s -o resp.json -w "%{http_code}" -H "X-Figma-Token: $FIGMA_TOKEN" \
                "https://api.figma.com/v1/images/$FILE?ids=$IDS&format=png&scale=1")
              if [ "$code" = "429" ] && [ $attempt -lt 10 ]; then
                attempt=$((attempt+1))
                wait=$((15*attempt))
                echo "batch @$i rate limited, sleeping ${wait}s (attempt $attempt)"
                sleep $wait
                continue
              fi
              break
            done
            echo "batch @$i http=$code ids=$(echo "$CHUNK" | jq length)"
            if [ "$code" != "200" ]; then echo "resp: $(head -c 400 resp.json)"; fi
            if [ "$code" = "200" ]; then
            echo "$CHUNK" | jq -c '.[]' | while read -r item; do
              id=$(echo "$item" | jq -r '.id')
              name=$(echo "$item" | jq -r '.name')
              url=$(jq -r --arg id "$id" '.images[$id] // empty' resp.json)
              if [ -z "$url" ] || [ "$url" = "null" ]; then echo "no image for $id ($name)"; continue; fi
              idd=$(echo "$id" | tr ':' '-')
              curl -sf "$url" -o "out/renders/${idd}__${name}.png" || echo "download failed: $id"
            done
            fi
            sleep 4
            i=$((i+25))
          done
          echo "rendered files: $(ls out/renders 2>/dev/null | wc -l)"
          du -sh out/renders 2>/dev/null || true
          SCRIPT
          chmod +x render.sh
          set -o pipefail
          ./render.sh 2>&1 | tee out-runlog.txt
          mkdir -p out; cp out-runlog.txt out/runlog.txt

      - name: Commit renders back to the working branch
        if: always()
        run: |
          set -euo pipefail
          git config user.email "figma-bot@users.noreply.github.com"
          git config user.name "figma-import-bot"
          git fetch --depth=1 origin +refs/heads/arena/01a0fd8d-a:refs/heads/target
          git checkout -B target target
          mkdir -p figma-import/renders
          cp -r out/renders/. figma-import/renders/ 2>/dev/null || true
          cp out/runlog.txt figma-import/runlog.txt 2>/dev/null || true
          cp out/geometry-log.txt figma-import/geometry-log.txt 2>/dev/null || true
          [ -f out/full-geometry.json ] && cp out/full-geometry.json figma-import/full-geometry.json
          true
          git add figma-import
          git commit -m "chore: temporary figma renders import" || echo "nothing to commit"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:arena/01a0fd8d-a
